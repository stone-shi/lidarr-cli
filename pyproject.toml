[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lidarr-cli"
version = "0.1.0"
description = "A CLI tool for Lidarr"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "click",
    "pydantic",
    "python-dotenv",
    "rich",
]

[project.scripts]
lidarr-cli = "main:main"

[tool.ruff]
line-length = 88
target-version = "py310"
